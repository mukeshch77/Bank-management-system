# ============================================================
# APPLICATION NAME
# ============================================================
spring.application.name=Bank Management System

# ============================================================
# DATABASE - Local Development (H2 in-memory)
# Production mein Render ka DATABASE_URL use hoga
# ============================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:bankdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (local development ke liye)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET:BankManagementSystemSecretKey2024SuperLongSecretKeyForSecurity}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# SERVER
# ============================================================
server.port=${PORT:8080}

# ============================================================
# LOGGING
# ============================================================
logging.level.com.bank.management=INFO
logging.level.org.springframework.security=WARN
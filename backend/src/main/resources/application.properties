spring.application.name=Bank Management System

# Database - Render environment variables se aayega
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console (local development)
spring.h2.console.enabled=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:BankManagementSystemSecretKey2024SuperLongSecretKeyForSecurity}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Server
server.port=${PORT:8080}

# Logging
logging.level.com.bank.management=INFO
logging.level.org.springframework.security=WARN